    --bg:#0F141C; --surface:#18202C; --text:#E8EFF8; --text-2:#A3B6CC;
    --line:#2E3A4E; --accent:#5AA9F0; --card-tint:#1D2736;
    --tagline:#D6E4F4; --glow:rgba(90,169,240,.22); --sea:#3C74B1; --sea-hi:#7FAEDB; --sea-lo:#1F4676; --shine:.3; --land:#9BBCE0; --coast:rgba(255,255,255,.55); --arab:#C3D8EE; --arab-line:rgba(255,255,255,.9); --edge:rgba(255,255,255,.3); --orbit:rgba(157,185,218,.55); --letter:#17283D; --letter-s:rgba(23,40,61,.7); --sub:#F6F9FD; --sub-line:rgba(15,26,40,.6); --land:#7FA6CE; --coast:rgba(255,255,255,.55); --arab:#A7C4E2; --arab-line:rgba(255,255,255,.95); --edge:rgba(5,12,24,.4); --orb-hi:#6E9FD2; --orb-mid:#3A6EA5; --orb-lo:#1D3A5E;
    --ring:rgba(90,169,240,.22); --dot:#5AA9F0; --dot-halo:rgba(90,169,240,.12); --hatch:rgba(90,169,240,.10); --wave:rgba(90,169,240,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#18202C; --text:#E8EFF8; --text-2:#A3B6CC;
  --line:#2E3A4E; --accent:#5AA9F0; --card-tint:#1D2736;
  --tagline:#D6E4F4; --glow:rgba(90,169,240,.22); --sea:#3C74B1; --sea-hi:#7FAEDB; --sea-lo:#1F4676; --shine:.3; --land:#9BBCE0; --coast:rgba(255,255,255,.55); --arab:#C3D8EE; --arab-line:rgba(255,255,255,.9); --edge:rgba(255,255,255,.3); --orbit:rgba(157,185,218,.55); --letter:#17283D; --letter-s:rgba(23,40,61,.7); --sub:#F6F9FD; --sub-line:rgba(15,26,40,.6); --land:#7FA6CE; --coast:rgba(255,255,255,.55); --arab:#A7C4E2; --arab-line:rgba(255,255,255,.95); --edge:rgba(5,12,24,.4); --orb-hi:#6E9FD2; --orb-mid:#3A6EA5; --orb-lo:#1D3A5E;
    --ring:rgba(90,169,240,.22); --dot:#5AA9F0; --dot-halo:rgba(90,169,240,.12); --hatch:rgba(90,169,240,.10); --wave:rgba(90,169,240,.22);
}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:hidden; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:17px; line-height:1.8}
.brand{font-family:var(--font-display); unicode-bidi:isolate}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}

.site-header{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); border-block-end:1px solid var(--line)}
.bar{max-width:1080px; margin-inline:auto; padding:14px 24px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px}
.logo{display:flex; align-items:center; gap:10px; text-decoration:none; font-size:24px; font-weight:600; transition:opacity .25s ease, visibility .25s}
.site-header.at-top .logo{opacity:0; visibility:hidden}
.nav{display:flex; gap:20px; justify-self:end; font-size:15px; order:3}
.nav a{text-decoration:none; color:var(--text-2)}
.nav a:hover{color:var(--text)}
.lang{position:relative; justify-self:center; order:2}
.logo{order:1; justify-self:start}
.lang-btn{display:flex; align-items:center; gap:8px; font:inherit; font-size:14px; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer}
.lang-btn svg{width:16px; height:16px; flex:none; color:var(--text-2)}
.lang-btn .chev{width:12px; height:12px; transition:transform .2s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-list{position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:20; margin:0; padding:6px; list-style:none; width:min(280px, calc(100vw - 32px)); max-height:min(70vh, 520px); overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px rgba(23,40,61,.14)}
.lang-list[hidden]{display:none}
.lang-opt{display:flex; flex-direction:column; gap:2px; padding:9px 12px; border-radius:10px; cursor:pointer; line-height:1.45; text-align:start}
.lang-opt:hover, .lang-opt:focus{background:var(--card-tint); outline:none}
.lang-opt[aria-selected="true"]{background:var(--card-tint); box-shadow:inset 3px 0 0 var(--accent)}
:root[dir="rtl"] .lang-opt[aria-selected="true"]{box-shadow:inset -3px 0 0 var(--accent)}
.lang-native{font-size:16px; font-weight:500; color:var(--text)}
.lang-sub{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px; color:var(--text-2)}
.lang-opt [lang="ur"]{font-family:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",serif; line-height:2}
.lang-opt [lang="hi"]{font-family:"Noto Sans Devanagari",sans-serif}
.lang-opt [lang="bn"]{font-family:"Noto Sans Bengali",sans-serif}
.lang-opt [lang="zh"]{font-family:"Noto Sans SC",sans-serif}

/* Per-language body fonts for scripts outside Latin/Arabic */
:root[lang="hi"]{--font-body:"Noto Sans Devanagari","IBM Plex Sans",system-ui,sans-serif}
:root[lang="bn"]{--font-body:"Noto Sans Bengali","IBM Plex Sans",system-ui,sans-serif}
:root[lang="zh"]{--font-body:"Noto Sans SC","IBM Plex Sans",system-ui,sans-serif}
:root[lang="ur"]{--font-body:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",serif}
:root[lang="ur"] body{line-height:2.3}

main{max-width:1080px; margin-inline:auto; padding:0 24px 64px}
.hero{position:relative; padding:40px 0 170px; display:flex; flex-direction:column; align-items:center; text-align:center}
.hero-logo{position:relative; width:min(380px, 72vw); margin:0 auto; display:block}
.hero-logo img{display:block; width:100%; height:auto}
.hero-logo .sym-dark, .app-icon .sym-dark{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero-logo .sym-light, :root:not([data-theme="light"]) .app-icon .sym-light{display:none} :root:not([data-theme="light"]) .hero-logo .sym-dark, :root:not([data-theme="light"]) .app-icon .sym-dark{display:block} }
:root[data-theme="dark"] .hero-logo .sym-light, :root[data-theme="dark"] .app-icon .sym-light{display:none} :root[data-theme="dark"] .hero-logo .sym-dark, :root[data-theme="dark"] .app-icon .sym-dark{display:block}
.hero-logo svg{display:block; width:100%; height:auto; overflow:visible}
.hero-logo .bl{fill:var(--letter); font-family:var(--font-body); font-weight:700}
.hero-logo .bs{fill:var(--letter-s); font-family:var(--font-body); font-weight:500}
.hero-logo .sub{fill:var(--sub); stroke:var(--sub-line); font-family:var(--font-body); font-weight:500}
.hero-art{position:absolute; top:0; bottom:0; left:50%; width:100vw; transform:translateX(-50%); overflow:hidden; pointer-events:none}
.hero-art .wave{position:absolute; bottom:0; left:0; width:100%; height:150px;
  -webkit-mask-image:linear-gradient(to bottom, transparent, #000 55%); mask-image:linear-gradient(to bottom, transparent, #000 55%)}
/* the decorative wave is part of the identity: never mirrored */
.hero .rule{position:relative; display:block; width:72px; height:3px; margin-block-start:14px; border-radius:3px;
  background:linear-gradient(to right, transparent, var(--accent), transparent)}
.hero h1{position:relative; margin:10px 0 0; font-family:var(--font-display); font-weight:600; font-size:clamp(52px,11vw,112px); line-height:1.05}
.hero p{position:relative; margin:4px auto 0; font-size:clamp(19px,2.6vw,24px); color:var(--tagline); font-weight:500; max-width:52ch}

.section{position:relative; overflow:hidden; border:1px solid var(--line); border-radius:18px; padding:32px; margin-block-start:24px;
  background:linear-gradient(to bottom, var(--card-tint), var(--surface) 70%)}
.section > *{position:relative}
.section h2{margin:0 0 6px; font-family:var(--font-display); font-weight:500; font-size:28px}
.products{margin-block-start:40px}
.products-title{text-align:center; margin:0 0 16px; font-family:var(--font-display); font-weight:500; font-size:28px}
:root:not([lang="en"]) .products-title{font-family:var(--font-body); font-weight:700; font-size:26px}
.products-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr))}
.product{text-align:center; border:1px solid var(--line); border-radius:18px; padding:24px; background:linear-gradient(to bottom, var(--card-tint), var(--surface) 70%)}
.product h3{margin:0 0 6px; font-size:22px; font-weight:500}
.product p{margin:0 auto; color:var(--text-2); font-size:16px; line-height:1.8; max-width:36ch}
.product .soon{display:inline-block; margin-block-start:14px; font-size:13px; color:var(--accent); border:1px solid var(--line); border-radius:999px; padding:2px 10px}
.product.is-first{border-color:var(--accent)}
.product .app-icon{display:block; width:72px; height:72px; margin:0 auto 12px}
.product .app-icon img{width:100%; height:100%; border-radius:22%}
.product .app-icon.placeholder img{border-radius:50%; opacity:.35; filter:saturate(.6)}
a.product-link{display:block; color:inherit; text-decoration:none; border-radius:18px}
a.product-link:hover .product{box-shadow:0 12px 30px -18px rgba(23,40,61,.45)}
a.product-link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.product .soon.dev{background:var(--accent); border-color:var(--accent); color:var(--surface)}
:root:not([lang="en"]) .section h2{font-family:var(--font-body); font-weight:700; font-size:26px}
:root:not([lang="en"]) .section h2 .brand{font-family:var(--font-display); font-weight:500; font-size:28px}
.section{text-align:center}
.section-body{margin:0 auto; font-size:17px; line-height:1.85; color:var(--text-2); max-width:62ch}
/* centred text: spread words evenly over the lines so no line is left short */
.hero p, .section h2, .section-body, .products-title, .product h3, .product p{text-wrap:balance}

footer{max-width:1080px; margin-inline:auto; padding:24px; border-block-start:1px solid var(--line); color:var(--text-2); font-size:14px}

@media (max-width:720px){
  .nav{display:none}
  .bar{grid-template-columns:1fr auto 1fr}
  .section{padding:24px}
  .hero{padding-top:16px; padding-bottom:110px}
  .hero-art .wave{height:90px}
}
/* Wide screens: three columns — About on one side, the symbol, name and tagline in the middle, the apps on the other side.
   Everything fits in one screen; the columns mirror automatically in right-to-left languages. */
@media (min-width:1100px){
  /* The whole page, wave and footer included, fits the screen height: sizes follow the viewport height */
  body{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh}
  /* Every section is already on screen, so the in-page links in the header have nothing to jump to */
  .nav{display:none}
  main{flex:1 0 auto; width:100%; box-sizing:border-box; position:relative; max-width:1320px; margin-inline:auto;
       padding:clamp(6px,1.5vh,16px) 32px clamp(60px,11vh,120px);
       display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); column-gap:48px; align-items:center; align-content:center}
  .hero{grid-column:2; grid-row:1; position:static; padding:0}
  .hero-logo{width:clamp(180px,36vh,400px)}
  .hero h1{font-size:clamp(44px,8.5vh,100px); line-height:1.05; margin-top:6px}
  .hero p{font-size:clamp(16px,2.6vh,22px)}
  .hero-art .wave{height:clamp(56px,11vh,120px)}
  footer{padding:8px 24px 10px; border-block-start:0; font-size:13px}
  .hero .rule{margin-block-start:10px}
  #about{grid-column:1; grid-row:1; justify-self:end; max-width:40ch; margin:0; padding:0; border:0; background:none; text-align:center}
  #about h2{display:block; margin:0 0 8px; font-size:clamp(20px,3.6vh,26px); line-height:1.3}
  #about .section-body{margin:0 auto; font-size:clamp(15px,2.4vh,17px); line-height:1.75}
  .products{grid-column:3; grid-row:1; justify-self:start; width:100%; max-width:460px; margin:0}
  .products-title{display:block; text-align:center; font-size:clamp(19px,3.4vh,24px); line-height:1.3; margin:0 0 clamp(6px,1.2vh,10px)}
  .products-grid{grid-template-columns:1fr; gap:clamp(6px,1.2vh,10px)}
  .product{display:grid; grid-template-columns:auto 1fr; column-gap:14px; align-items:center; padding:clamp(8px,1.4vh,12px) 16px; text-align:center}
  .product .app-icon{grid-row:1 / span 3; width:clamp(40px,7vh,52px); height:clamp(40px,7vh,52px); margin:0}
  .product h3, .product p, .product .soon{grid-column:2}
  .product h3{margin:0; font-size:clamp(15.5px,2.6vh,18px); line-height:1.3}
  .product p{margin:0 auto; font-size:clamp(12.5px,1.9vh,13.5px); line-height:1.45; max-width:none}
  .product .soon{justify-self:center; margin-block-start:clamp(3px,.8vh,6px); padding:1px 10px; font-size:12px; line-height:1.5}
}
@media (prefers-reduced-motion: no-preference){
  .hero h1,.hero p{animation:rise .7s ease-out both}
  .hero p{animation-delay:.12s}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
}
</style>

// Product names stay the same in every language
const PRODUCTS = [
  { name: "Asasly Arabic", body: "arabicBody", first: true, href: LAUNCH_URL },
  { name: "Asasly Quran", body: "quranBody" },
  { name: "Asasly Islam", body: "islamBody" }
];

function renderProducts(dict, dir) {
  const grid = document.getElementById("productsGrid");
  grid.innerHTML = PRODUCTS.map(p => {
    const icon = p.first
      ? `<span class="app-icon" aria-hidden="true"><img class="sym-light" alt="" src="${APP_ICON_LIGHT}"><img class="sym-dark" alt="" src="${APP_ICON_DARK}"></span>`
      : `<span class="app-icon placeholder" aria-hidden="true"><img alt="" src="${APP_ICON_PLACEHOLDER}"></span>`;
    const card = `
    <article class="product${p.first ? " is-first" : ""}">
      ${icon}<h3>${withBrand(p.name, dir)}</h3>
      <p>${withBrand(dict[p.body], dir)}</p>
      ${p.first ? `<span class="soon dev">${esc(dict.dev)}</span>` : `<span class="soon">${esc(dict.soon)}</span>`}
    </article>`;
    return p.href ? `<a class="product-link" href="${p.href}">${card}</a>` : card;
  }).join("");
}

const STORAGE_KEY = "asasly.lang";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// In RTL languages, each continuous Latin phrase is isolated as one LTR unit,
// so multi-word names like "Asasly Arabic" keep their order.
const LATIN_RUN = /[A-Za-z][A-Za-z0-9'’&.\- ]*[A-Za-z0-9]|[A-Za-z]/g;
function withBrand(s, dir) {
  const safe = esc(s);
  if (dir === "rtl") {
    return safe.replace(LATIN_RUN, run =>
      `<bdi dir="ltr"${run.startsWith("Asasly") ? ' class="brand"' : ""}>${run}</bdi>`);
  }
  return safe.replace(/Asasly(?: (?:[A-Z][A-Za-z]*|of))*/g, m => `<span class="brand">${m}</span>`);
}

function applyLanguage(code) {
  const lang = LANGUAGES.find(l => l.code === code) || LANGUAGES[0];
  const dict = translations[lang.code];
  document.documentElement.lang = lang.code;
  document.documentElement.dir = lang.dir;
  document.title = dict.pageTitle;
  renderProducts(dict, lang.dir);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const text = dict[el.dataset.i18n];
    if (text !== undefined) el.innerHTML = withBrand(text, lang.dir);
  });
  document.querySelectorAll("[data-i18n-label]").forEach(el => {
    el.setAttribute("aria-label", dict[el.dataset.i18nLabel] || "");
  });
  const cur = document.getElementById("langCurrent");
  cur.textContent = lang.native; cur.lang = lang.code;
  document.getElementById("langBtn").setAttribute("aria-label", dict.langLabel + ": " + lang.native);
  document.querySelectorAll("#langList .lang-opt").forEach(o => {
    o.setAttribute("aria-selected", String(o.dataset.lang === lang.code));
  });
  try { localStorage.setItem(STORAGE_KEY, lang.code); } catch (e) {}
}

function buildSwitcher() {
  const btn = document.getElementById("langBtn");
  const list = document.getElementById("langList");
  const span = (text, code) => { const s = document.createElement("bdi"); s.textContent = text; s.lang = code; return s; };
  LANGUAGES.forEach(l => {
    const li = document.createElement("li");
    li.className = "lang-opt"; li.setAttribute("role", "option"); li.tabIndex = -1; li.dataset.lang = l.code;
    const top = document.createElement("span"); top.className = "lang-native";
    top.appendChild(span(l.native, l.code));
    const sub = document.createElement("span"); sub.className = "lang-sub";
    if (l.english !== l.native) sub.appendChild(span(l.english, "en"));
    if (l.arabic !== l.native) sub.appendChild(span(l.arabic, "ar"));
    li.append(top, sub);
    li.addEventListener("click", () => { applyLanguage(l.code); close(true); });
    list.appendChild(li);
  });
  const opts = () => [...list.querySelectorAll(".lang-opt")];
  function open() {
    list.hidden = false; btn.setAttribute("aria-expanded", "true");
    (list.querySelector('[aria-selected="true"]') || opts()[0]).focus();
  }
  function close(refocus) {
    list.hidden = true; btn.setAttribute("aria-expanded", "false");
    if (refocus) btn.focus();
  }
  btn.addEventListener("click", () => list.hidden ? open() : close(false));
  list.addEventListener("keydown", e => {
    const all = opts(); const i = all.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); all[Math.min(i + 1, all.length - 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); all[Math.max(i - 1, 0)].focus(); }
    else if (e.key === "Home") { e.preventDefault(); all[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); all[all.length - 1].focus(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.activeElement.click(); }
    else if (e.key === "Escape" || e.key === "Tab") { close(e.key === "Escape"); }
  });
  document.addEventListener("click", e => { if (!list.hidden && !e.target.closest("#langSwitcher")) close(false); });
}

function initialLanguage() {
  let saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (saved && translations[saved]) return saved;
  const browser = (navigator.language || "").slice(0, 2);
  return translations[browser] ? browser : "en";
}

buildSwitcher();
applyLanguage(initialLanguage());

// Pull the name up so its lowercase letters sit just under the sphere, whatever the font size
// The name now sits under the free-standing symbol; no overlap fitting needed.
function fitName() {}
fitName();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);
window.addEventListener("load", fitName);
window.addEventListener("resize", fitName);

// Show the header name only once the big hero name has scrolled out of view
(function(){
  const header = document.querySelector(".site-header");
  const heroName = document.querySelector(".hero h1");
  if (!("IntersectionObserver" in window) || !heroName) { header.classList.remove("at-top"); return; }
  new IntersectionObserver(([e]) => header.classList.toggle("at-top", e.isIntersecting),
    { rootMargin: "-72px 0px 0px 0px" }).observe(heroName);
})();
</script>
